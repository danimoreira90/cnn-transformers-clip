[project]
name = "cv-mba"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "danimoreira90", email = "101526289+danimoreira90@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pillow>=11.3.0",
    "scikit-learn>=1.6.1",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
local = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pytest>=9.1.1",
]

[tool.uv]
resolution = "lowest-direct"

